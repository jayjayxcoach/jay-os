    return `<div class="sitem"><button class="srow mrow" data-act="edit-member" data-id="${esc(mb.id)}">${av(mb)}<span class="nm">${esc(mb.name)} ${mb.id === S.me ? '<span class="you">tú</span>' : ""}<span class="role">${esc(mb.role || "")}</span></span><span class="pc" title="Tareas abiertas">${open}</span></button></div>`;
  }).join("") : `<p class="brand-sub" style="padding:4px 8px">Agrega a las personas del equipo para asignarles tareas.</p>`;
}

/* ---------- Vista: Resumen ---------- */
function viewSummary() {
  const ts = S.f.project ? S.tasks.filter(t => t.projectId === S.f.project) : S.tasks;
  const total = ts.length, done = ts.filter(isDone).length, doing = ts.filter(t => t.status === "doing").length;
  const todo = total - done - doing, over = ts.filter(isOver).length, wk = ts.filter(doneRecently).length;
  const pct = total ? Math.round(done * 100 / total) : 0;
  const R = 50, C = 2 * Math.PI * R, off = C * (1 - pct / 100);
  const ring = `<svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="12"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--lime)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" fill="#fff" font-family="DM Mono, monospace" font-size="18">${done}/${total}</text></svg>`;
  const head = `<section class="sum-top">
    <div class="hero">${ring}<div><div class="lbl">Avance ${S.f.project ? "del proyecto" : "general"}</div><div class="big">${pct}%</div><div class="sm">${done} de ${total} tareas terminadas</div></div></div>
    <div class="stats">
      <div class="stat"><div class="lbl"><i style="--c:var(--fg-3)"></i>Por hacer</div><div class="num">${todo}</div></div>
      <div class="stat"><div class="lbl"><i style="--c:var(--lav)"></i>En proceso</div><div class="num">${doing}</div></div>
      <div class="stat"><div class="lbl"><i style="--c:var(--lime-strong)"></i>Hechas en 7 días</div><div class="num">${wk}</div></div>
      <div class="stat ${over ? "alert" : ""}"><div class="lbl"><i style="--c:var(--danger)"></i>Vencidas</div><div class="num">${over}</div>${over ? `<div class="hint">Pasaron su fecha límite</div>` : ""}</div>
    </div></section>`;

  const ps = S.f.project ? [P(S.f.project)].filter(Boolean) : projSorted();
  const cards = ps.map(p => projectCard(p)).join("");
  const active = S.projects.filter(p => p.estado !== "Terminado").length;

  const today = dnum(todayIso());
  const soon = ts.filter(t => !isDone(t) && isDate(t.due) && dnum(t.due) <= today + 7).sort((a, b) => dnum(a.due) - dnum(b.due) || sortTasks(a, b));
  const list = soon.slice(0, 9).map(t => listRow(t)).join("") || `<p class="muted" style="margin:4px 6px">Nada vence en los próximos 7 días.</p>`;

  const team = [...S.members].sort((a,b) => String(a.name).localeCompare(String(b.name), "es")).map(mb => {
    const mine = ts.filter(t => t.assignee === mb.id);
    return `<div class="team-row">${av(mb, "lg")}<div class="tt"><b>${esc(mb.name)}</b><span>${esc(mb.role || "")}</span></div><div class="n">${mine.filter(t => !isDone(t)).length} abiertas<br>${mine.filter(doneRecently).length} hechas en 7 días</div></div>`;
  }).join("");
  const unassigned = ts.filter(t => !t.assignee && !isDone(t)).length;

  return head +
    `<div class="sec-h">Proyectos <span>${S.f.project ? "" : `${active} activos de ${S.projects.length}`}</span></div><div class="pgrid">${cards}</div>
    <div class="sum-cols">
      <section class="tile"><h3>Vencidas y próximos 7 días <span>${soon.length}</span></h3>${list}${soon.length > 9 ? `<button class="more" data-act="view" data-view="semana">Ver todo en la semana</button>` : ""}</section>
      <section class="tile"><h3>Equipo</h3>${team || `<p class="muted" style="margin:0">Agrega personas desde el panel de la izquierda.</p>`}${unassigned ? `<p class="muted" style="margin:4px 4px 0;font-size:13px">${unassigned} tareas abiertas no tienen responsable.</p>` : ""}</section>
    </div>`;
}
function projectCard(p) {
  const st = projStats(p.id), c = pcolor(p);
  const byPh = PHASES.map((_, i) => { const x = st.ts.filter(t => t.phase === i); return {n: x.length, d: x.filter(isDone).length}; });
  let cur = byPh.findIndex(x => x.n && x.d < x.n);
  const phases = byPh.map((x, i) => `<div class="ph ${x.n ? "" : "none"} ${i === cur ? "cur" : ""}" title="${i} · ${PHASES[i]}: ${x.n ? `${x.d} de ${x.n} hechas` : "sin tareas"}"><div class="b"><span style="width:${x.n ? Math.round(x.d * 100 / x.n) : 0}%"></span></div><em>${i} ${PHASE_SHORT[i]}</em></div>`).join("");
  const next = st.ts.filter(t => !isDone(t)).sort(sortTasks)[0];
  const owner = M(p.owner);
  const launch = isDate(p.launch)
    ? `<span>Lanza <b>${fmtShort(p.launch)}</b> <span class="${dnum(p.launch) < dnum(todayIso()) && p.estado !== "Terminado" ? "od" : ""}">(${rel(p.launch)})</span></span>`
    : `<span>Sin fecha de lanzamiento</span>`;
  return `<article class="pcard" style="--c:var(--${c})" data-proj="${esc(p.id)}" tabindex="0" aria-label="Abrir ${esc(p.name)} en el tablero">
    <header class="pcard-h"><div class="t"><div class="kick">${esc([p.tipo, p.etapa].filter(Boolean).join(" · ") || "Proyecto")}</div><h4>${esc(p.name)}</h4></div>${p.estado && p.estado !== "Activo" ? `<span class="estado">${esc(p.estado)}</span>` : ""}<button class="icon-btn" data-act="edit-project" data-id="${esc(p.id)}" data-edit aria-label="Editar proyecto">${I.edit}</button></header>
    <div class="pcard-b">
      <div class="prog"><div class="track"><span style="width:${st.pct}%"></span></div><span class="n">${st.done}/${st.total} · ${st.pct}%</span></div>
      <div class="phases" aria-label="Avance por fase">${phases}</div>
      <div class="pmeta">${launch}${st.over ? `<span class="od">${st.over} vencidas</span>` : ""}${owner ? `<span>Lidera <b>${esc(owner.name)}</b></span>` : ""}</div>
      ${next ? `<div class="pnext"><span>Sigue:</span><b>${esc(next.title)}</b></div>` : `<div class="pnext"><span>${st.total ? "Todas las tareas están hechas." : "Sin tareas todavía."}</span></div>`}
    </div></article>`;
}
function listRow(t) {
  const p = P(t.projectId);
  return `<div class="lrow" data-task="${esc(t.id)}" tabindex="0"><span class="pdot" style="--c:var(--${pcolor(p)})"></span><div class="tt"><b>${esc(t.title)}</b><span>${esc(p ? p.name : "Sin proyecto")}</span></div>${av(M(t.assignee), "sm")}<span class="dchip ${isOver(t) ? "od" : ""}">${fmtDue(t.due)}</span></div>`;
}

/* ---------- Vista: Tablero ---------- */
function card(t) {
  const p = P(t.projectId), done = isDone(t), od = isOver(t), m = M(t.assignee);
  const doneBy = done && M(t.doneBy);
  return `<article class="card ${done ? "is-done" : ""}" style="--c:var(--${pcolor(p)})" draggable="${!S.readOnly}" data-task="${esc(t.id)}" tabindex="0">
    <div class="card-top">${isDate(t.due) ? `<span class="due ${od ? "od" : ""}">${I.cal}${fmtDue(t.due)}</span>` : `<span class="due">Sin fecha</span>`}
      <button class="tick" data-act="tick" data-id="${esc(t.id)}" aria-label="${done ? "Volver a pendiente" : "Marcar como hecha"}" ${S.readOnly ? "disabled" : ""}>${I.check}</button></div>
    <h4 class="card-title">${esc(t.title)}</h4>
    <div class="card-meta"><span class="pj">${esc(p ? p.name : "Sin proyecto")}</span>${t.phase != null && PHASES[t.phase] ? `<span>· ${t.phase} ${PHASES[t.phase]}</span>` : ""}</div>
    <div class="card-foot"><span class="tag ${prio(t) === 1 ? "p1" : ""}" title="${PRIO[prio(t)]}">P${prio(t)}</span>${t.blocks ? `<span class="tag">${I.lock}Bloquea</span>` : ""}${t.focus ? `<span class="tag">${I.bolt}Foco</span>` : ""}${done ? `<span class="done-meta">${doneBy ? `por ${esc(doneBy.name.split(" ")[0])}` : ""}${t.doneAt ? ` · ${fmtShort(localIso(new Date(t.doneAt)))}` : ""}</span>` : ""}${av(m, "sm")}</div>
  </article>`;
}
function viewBoard() {
  const ts = filtered();
  const cols = STAT.map(([k, label]) => {
    let list = ts.filter(t => (t.status || "todo") === k);
    if (k === "done") list.sort((a, b) => String(b.doneAt || "").localeCompare(String(a.doneAt || "")));
    else list.sort(sortTasks);
    const total = list.length;
    const cut = k === "done" && !S.showAllDone && total > 12;
    if (cut) list = list.slice(0, 12);
    return `<section class="col" data-col="${k}" aria-label="${label}">
      <div class="col-h">${label}<span class="n">${total}</span>${k !== "done" ? `<button class="icon-btn" data-act="add-in-col" data-status="${k}" data-edit aria-label="Agregar tarea en ${label}">${I.plus}</button>` : ""}</div>
      ${list.map(card).join("") || `<div class="col-empty">${k === "done" ? "Las tareas terminadas aparecen aquí." : k === "doing" ? "Arrastra aquí lo que estás haciendo ahora." : "No hay tareas pendientes con este filtro."}</div>`}
      ${cut ? `<button class="more" data-act="show-done">Ver las ${total} terminadas</button>` : ""}
    </section>`;
  }).join("");
  const hint = S.f.mine && !S.me ? `<div class="tl-note">${I.info}<span>Elige quién eres arriba a la derecha para ver solo tus tareas.</span></div>` : "";
  return hint + `<div class="board-wrap"><div class="board">${cols}</div></div>`;
}

/* ---------- Vista: Línea de tiempo ---------- */
function viewTimeline() {
  const narrow = window.innerWidth < 700;
  const DW = narrow ? 22 : 30, LW = narrow ? 150 : 250;
  const today = dnum(todayIso());
  const projs = S.f.project ? projSorted().filter(p => p.id === S.f.project) : projSorted();
  const vis = filtered();
  const spans = projs.map(p => {
    const ts = vis.filter(t => t.projectId === p.id);
    const ds = ts.flatMap(t => [t.start, t.due]).filter(isDate).map(dnum);
    const s = isDate(p.start) ? dnum(p.start) : ds.length ? Math.min(...ds) : null;
    const l = isDate(p.launch) ? dnum(p.launch) : null;
    const lastT = ds.length ? Math.max(...ds) : null;
    return {p, ts, s, l, e: l != null ? Math.max(l, lastT ?? l) : lastT};
  });
  let min = today - 21, max = today + 70;
  spans.forEach(x => { if (x.s != null) min = Math.min(min, x.s - 3); if (x.e != null) max = Math.max(max, x.e + 10); if (x.l != null) max = Math.max(max, x.l + 10); });
  if (max - min > 300) { min = Math.max(min, today - 120); max = Math.min(max, min + 300); }
  min = dnum(mondayOf(fromNum(min)));
  const days = max - min + 1, TW = days * DW, X = n => (n - min) * DW;
  S._tl = {DW, X, today, LW};

  let months = "", dayn = "", wk = "";
  for (let i = 0; i < days; i++) {
    const s = fromNum(min + i), pp = parts(s);
    if (pp.d === 1 || (i === 0 && pp.d < 24)) months += `<span class="tl-m" style="left:${i * DW}px">${MESL[pp.m]} ${pp.y}</span>`;
    const we = pp.w === 0 || pp.w === 6;
    dayn += `<span class="tl-d ${we ? "we" : ""} ${min + i === today ? "now" : ""}" style="left:${i * DW}px;width:${DW}px">${pp.d}</span>`;
    if (we) wk += `<i class="wk" style="left:${i * DW}px;width:${DW}px"></i>`;
  }
  const rows = spans.map(x => {
    const c = pcolor(x.p), st = projStats(x.p.id);
    const isOpen = S.open.has(x.p.id) || !!S.f.project;
    let bar = "";
    if (x.s != null) {
      const open = x.l == null, e = x.e != null ? Math.max(x.e, x.s) : x.s;
      const live = open && x.p.estado !== "Terminado";
      const endD = live ? Math.max(e, today + 24) : open ? Math.max(e, x.s + 14) : e;
      const lblAt = live && today > x.s ? today - x.s : 0;
      bar = `<div class="bar ${open ? "open" : ""}" style="--c:var(--${c});left:${X(x.s)}px;width:${(endD - x.s + 1) * DW}px"><span style="margin-left:${lblAt * DW}px">${open ? "Sin fecha de lanzamiento" : `${st.pct}% hecho`}</span></div>`;
    }
    const launch = x.l != null ? `<span class="launch" style="left:${X(x.l) + DW / 2}px"><i></i><em>Lanza ${fmtShort(fromNum(x.l))}</em></span>` : "";
    const dots = isOpen ? "" : x.ts.filter(t => isDate(t.due)).map(t => `<i class="dot ${isDone(t) ? "done" : ""} ${isOver(t) ? "over" : ""}" style="left:${X(dnum(t.due)) + DW / 2}px;--c:var(--${c})" title="${esc(t.title)} · ${fmtShort(t.due)}"></i>`).join("");
    let html = `<div class="tl-row"><button class="tl-lab" data-act="tl-toggle" data-id="${esc(x.p.id)}" aria-expanded="${isOpen}" title="${esc(x.p.name)}"><span class="chev">${isOpen ? I.down : I.right}</span><span class="pdot" style="--c:var(--${c})"></span><span class="tl-name">${esc(x.p.name)}</span><span class="tl-n">${st.done}/${st.total}</span></button><div class="tl-track">${bar}${dots}${launch}</div></div>`;
    if (isOpen) {
      const dated = x.ts.filter(t => isDate(t.due) || isDate(t.start)).sort((a, b) => dnum(a.start || a.due) - dnum(b.start || b.due) || sortTasks(a, b));
      dated.forEach(t => {
        const a0 = dnum(isDate(t.start) ? t.start : t.due), b0 = dnum(isDate(t.due) ? t.due : t.start);
        const a = Math.min(a0, b0), b = Math.max(a0, b0);
        html += `<div class="tl-row sub" data-task="${esc(t.id)}"><div class="tl-lab sub-lab" title="${esc(t.title)}">${isDone(t) ? I.check : ""}<span class="tl-name">${esc(t.title)}</span></div><div class="tl-track"><div class="tbar ${isDone(t) ? "done" : ""} ${isOver(t) ? "over" : ""}" style="--c:var(--${c});left:${X(a)}px;width:${(b - a + 1) * DW}px" title="${esc(t.title)} · ${fmtShort(fromNum(b))}"></div></div></div>`;
      });
      const nod = x.ts.length - dated.length;
      if (nod) html += `<div class="tl-row sub"><div class="tl-lab sub-lab"><span class="tl-name muted">${nod} ${nod === 1 ? "tarea" : "tareas"} sin fecha</span></div><div class="tl-track"></div></div>`;
    }
    return html;
  }).join("");

  // Avisos: lanzamientos encimados y proyectos sin fecha
  const L = spans.filter(x => x.l != null && x.p.estado !== "Terminado").sort((a, b) => a.l - b.l);
  const notes = [];
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const gap = L[j].l - L[i].l;
    if (gap <= 7) notes.push(`<div class="tl-note warn">${I.warn}<span><b>${esc(L[i].p.name)}</b> y <b>${esc(L[j].p.name)}</b> lanzan ${gap === 0 ? "el mismo día" : `con ${gap} ${gap === 1 ? "día" : "días"} de diferencia`}. Revisa si el equipo puede con los dos.</span></div>`);
  }
  const noLaunch = spans.filter(x => x.l == null && x.p.estado !== "Terminado").length;
  if (noLaunch) notes.push(`<div class="tl-note">${I.flag}<span>${noLaunch === 1 ? "Un proyecto no tiene" : `${noLaunch} proyectos no tienen`} fecha de lanzamiento. Pónsela desde el lápiz del proyecto para ver si se enciman con otros.</span></div>`);

  return `${notes.length ? `<div class="tl-notes">${notes.join("")}</div>` : ""}
  <div class="tl-wrap"><div class="tl-scroll" id="tlScroll"><div class="tl" style="--lw:${LW}px;--tw:${TW}px;--dw:${DW}px">
    <div class="tl-grid">${wk}<i class="nowline" style="left:${X(today) + DW / 2}px"></i></div>
    <div class="tl-head"><div class="tl-lab tl-corner">Proyecto</div><div class="tl-track">${months}${dayn}</div></div>
    ${rows || `<div class="tl-row"><div class="tl-lab"><span class="muted">Sin proyectos</span></div><div class="tl-track"></div></div>`}
  </div></div>
  <div class="tl-legend"><span><i class="lg-dot"></i>Tarea con fecha límite</span><span><i class="lg-red"></i>Vencida</span><span><i class="lg-dia"></i>Lanzamiento</span><span><i class="lg-now"></i>Hoy</span><span>Toca un proyecto para ver sus tareas una por una</span></div></div>`;
}
function afterTimeline() {
  const sc = $("#tlScroll"); if (!sc || !S._tl) return;
  const vis = Math.max(0, sc.clientWidth - (S._tl.LW || 0));
  sc.scrollLeft = S.tlScroll != null ? S.tlScroll : Math.max(0, S._tl.X(S._tl.today) - vis * 0.3);
  sc.addEventListener("scroll", () => { S.tlScroll = sc.scrollLeft; }, {passive: true});
}

/* ---------- Vista: Semana ---------- */
function wblock(t) {
  const p = P(t.projectId), m = M(t.assignee), done = isDone(t);
  return `<div class="wblock ${done ? "is-done" : ""}" style="--c:var(--${pcolor(p)})" data-task="${esc(t.id)}" draggable="${!S.readOnly}" tabindex="0">
    <div class="card-title">${esc(t.title)}</div>
    <div class="row"><span>${esc(p ? p.name : "")}</span>${m ? av(m, "sm") : ""}<button class="tick" data-act="tick" data-id="${esc(t.id)}" aria-label="${done ? "Volver a pendiente" : "Marcar como hecha"}" ${S.readOnly ? "disabled" : ""}>${I.check}</button></div></div>`;
}
function viewWeek() {
  const ws = dnum(S.week), vis = filtered(), today = dnum(todayIso());
  let cols = "";
  for (let i = 0; i < 7; i++) {
    const n = ws + i, s = fromNum(n), pp = parts(s);
    const ts = vis.filter(t => t.due === s).sort((a, b) => Number(isDone(a)) - Number(isDone(b)) || sortTasks(a, b));
    const launches = S.projects.filter(p => p.launch === s && (!S.f.project || p.id === S.f.project));
    cols += `<section class="wday ${n === today ? "is-today" : ""} ${n < today ? "past" : ""}" aria-label="${DIAL[pp.w]} ${pp.d}">
      <div class="wpill"><span>${DIA[pp.w]}</span><b>${pp.d}</b>${ts.length ? `<em>${ts.filter(t => !isDone(t)).length}/${ts.length}</em>` : ""}</div>
      <div class="wcol" data-dropday="${s}">
        ${launches.map(p => `<div class="wlaunch" style="--c:var(--${pcolor(p)})">${I.flag}Lanza ${esc(p.name)}</div>`).join("")}
        ${ts.map(wblock).join("")}
        <button class="wadd" data-act="add-on-day" data-day="${s}" data-edit aria-label="Agregar tarea el ${pp.d} de ${MESL[pp.m]}">${I.plus}</button>
      </div></section>`;
  }
  const before = vis.filter(t => isOver(t) && dnum(t.due) < ws).length;
  const undated = vis.filter(t => !isDone(t) && !isDate(t.due)).length;
  const bar = [];
  if (before) bar.push(`<button class="chip-t" style="background:var(--surface);color:var(--danger)" data-act="view" data-view="tablero">${I.warn}${before} vencidas de semanas anteriores</button>`);
  if (undated) bar.push(`<button class="chip-t" style="background:var(--surface);color:var(--fg-2)" data-act="view" data-view="tablero">${undated} tareas sin fecha</button>`);
  return `${bar.length ? `<div class="week-bar">${bar.join("")}</div>` : ""}<div class="week">${cols}</div>`;
}

/* ---------- Hojas de edición ---------- */
const opt = (v, l, sel) => `<option value="${esc(v)}" ${sel ? "selected" : ""}>${esc(l)}</option>`;
function openSheet(html, kind, id) {
  const sh = $("#sheet");
  sh.innerHTML = html; sh.dataset.kind = kind; sh.dataset.id = id || "";
  sh.hidden = false; $("#scrim").hidden = false; document.body.classList.add("locked");
  const f = sh.querySelector("[autofocus]") || sh.querySelector("input,select,textarea");
  if (f && !(window.innerWidth < 680 && kind === "task" && id)) f.focus();
}
function closeSheet() {
  const sh = $("#sheet"); sh.hidden = true; sh.innerHTML = "";
  $("#scrim").hidden = !$("#side").classList.contains("open");
  document.body.classList.remove("locked");
}
function taskSheet(id, preset = {}) {
  const t = id ? T(id) : null; if (id && !t) return;
  if (!t && !S.projects.length) { toast("Primero crea un proyecto."); return; }
  const d = t || {title: "", projectId: preset.projectId || S.f.project || projSorted()[0].id, assignee: S.me || "", status: preset.status || "todo", prio: 3, phase: null, start: "", due: preset.due || "", focus: false, blocks: false, notes: ""};
  const ro = S.readOnly, dis = ro ? "disabled" : "";
  const p = P(d.projectId);
  const doneBy = t && isDone(t) ? M(t.doneBy) : null;
  openSheet(`<form id="sheetForm" class="sheet-form" novalidate>
    <header class="sheet-h"><span class="pdot" style="--c:var(--${pcolor(p)})"></span><h2 id="sheetTitle">${t ? "Tarea" : "Nueva tarea"}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Cerrar">${I.x}</button></header>
    <label class="fld"><span>Qué hay que hacer</span><textarea id="f-title" rows="2" ${ro ? "readonly" : ""} ${t ? "" : "autofocus"}>${esc(d.title)}</textarea></label>
    <fieldset class="fld"><legend>Estado</legend><div class="seg2">${STAT.map(([v, l]) => `<label><input type="radio" name="f-status" value="${v}" ${(d.status || "todo") === v ? "checked" : ""} ${dis}><span>${l}</span></label>`).join("")}</div></fieldset>
    ${doneBy || (t && isDone(t)) ? `<p class="done-by">${I.check}Hecha${doneBy ? ` por ${esc(doneBy.name)}` : ""}${t.doneAt ? ` el ${fmtShort(localIso(new Date(t.doneAt)))}` : ""}</p>` : ""}
    <div class="grid2">
      <label class="fld"><span>Proyecto</span><select id="f-project" ${dis}>${projSorted().map(x => opt(x.id, x.name, x.id === d.projectId)).join("")}</select></label>
      <label class="fld"><span>Responsable</span><select id="f-assignee" ${dis}>${opt("", "Sin asignar", !d.assignee)}${S.members.map(m => opt(m.id, m.name, m.id === d.assignee)).join("")}</select></label>
      <label class="fld"><span>Fase</span><select id="f-phase" ${dis}>${opt("", "Sin fase", d.phase == null)}${PHASES.map((x, i) => opt(i, `${i} · ${x}`, d.phase === i)).join("")}</select></label>
      <label class="fld"><span>Prioridad</span><select id="f-prio" ${dis}>${[1,2,3,4].map(i => opt(i, `P${i} · ${PRIO[i]}`, prio(d) === i)).join("")}</select></label>
      <label class="fld"><span>Empieza</span><input type="date" id="f-start" value="${esc(d.start || "")}" ${dis}></label>
      <label class="fld"><span>Fecha límite</span><input type="date" id="f-due" value="${esc(d.due || "")}" ${dis}></label>
    </div>
    <div class="checks"><label class="ck"><input type="checkbox" id="f-focus" ${d.focus ? "checked" : ""} ${dis}><span>Foco de la semana</span></label><label class="ck"><input type="checkbox" id="f-blocks" ${d.blocks ? "checked" : ""} ${dis}><span>Bloquea otras tareas</span></label></div>
    <label class="fld"><span>Detalle</span><textarea id="f-notes" rows="4" ${ro ? "readonly" : ""} placeholder="Contexto, enlaces, qué se considera terminado…">${esc(d.notes || "")}</textarea></label>
    <footer class="sheet-f">${t && !ro ? `<button type="button" class="btn-ghost danger" data-act="del-task" data-id="${esc(t.id)}">${I.trash}Eliminar</button>` : ""}<div class="sheet-f-r"><button type="button" class="btn-ghost" data-act="close">${ro ? "Cerrar" : "Cancelar"}</button>${ro ? "" : `<button type="submit" class="btn-pill">${t ? "Guardar" : "Crear tarea"}</button>`}</div></footer>
  </form>`, "task", id);
}
function projectSheet(id) {
  const p = id ? P(id) : null; if (id && !p) return;
  const used = new Set(S.projects.map(x => x.color));
  const d = p || {name: "", color: COLORS.find(c => !used.has(c)) || COLORS[S.projects.length % COLORS.length], estado: "Activo", etapa: "Montaje", tipo: "Producto propio", prio: "Media", start: todayIso(), launch: "", owner: S.me || "", notes: ""};
  const st = p ? projStats(p.id) : null;
  const posNow = p ? [...S.projects].sort(byRank).findIndex(x => x.id === p.id) + 1 : S.projects.length + 1;
  openSheet(`<form id="sheetForm" class="sheet-form" novalidate>
    <header class="sheet-h"><span class="pdot" style="--c:var(--${pcolor(d)})"></span><h2 id="sheetTitle">${p ? "Proyecto" : "Nuevo proyecto"}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Cerrar">${I.x}</button></header>
    <label class="fld"><span>Nombre del proyecto</span><input id="p-name" value="${esc(d.name)}" autofocus></label>
    <fieldset class="fld"><legend>Color</legend><div class="swatches">${COLORS.map(c => `<label title="${COLOR_NAMES[c]}"><input type="radio" name="p-color" value="${c}" ${d.color === c ? "checked" : ""} aria-label="${COLOR_NAMES[c]}"><span style="--c:var(--${c})"></span></label>`).join("")}</div></fieldset>
    <div class="grid2">
      <label class="fld"><span>Estado</span><select id="p-estado">${P_ESTADO.map(x => opt(x, x, d.estado === x)).join("")}</select></label>
      <label class="fld"><span>Etapa</span><select id="p-etapa">${P_ETAPA.map(x => opt(x, x, d.etapa === x)).join("")}</select></label>
      <label class="fld"><span>Tipo</span><select id="p-tipo">${P_TIPO.map(x => opt(x, x, d.tipo === x)).join("")}</select></label>
      <label class="fld"><span>Prioridad</span><select id="p-prio">${P_PRIO.map(x => opt(x, x, d.prio === x)).join("")}</select></label>
      <label class="fld"><span>Arranca</span><input type="date" id="p-start" value="${esc(d.start || "")}"></label>
      <label class="fld"><span>Fecha de lanzamiento</span><input type="date" id="p-launch" value="${esc(d.launch || "")}"></label>
      <label class="fld"><span>Lo lidera</span><select id="p-owner">${opt("", "Nadie todavía", !d.owner)}${S.members.map(m => opt(m.id, m.name, m.id === d.owner)).join("")}</select></label>
      <label class="fld"><span>Posición en la lista (1 = arriba)</span><input type="number" id="p-rank" min="1" max="${S.projects.length + (p ? 0 : 1)}" value="${posNow}" inputmode="numeric"></label>
    </div>
    <label class="fld"><span>Objetivo y notas</span><textarea id="p-notes" rows="4" placeholder="Qué se busca lograr, a quién se le vende, precios…">${esc(d.notes || "")}</textarea></label>
    <footer class="sheet-f">${p ? `<button type="button" class="btn-ghost danger" data-act="del-project" data-id="${esc(p.id)}">${I.trash}Eliminar</button>` : ""}<div class="sheet-f-r"><button type="button" class="btn-ghost" data-act="close">Cancelar</button><button type="submit" class="btn-pill">${p ? "Guardar" : "Crear proyecto"}</button></div></footer>
    ${p && st.total ? `<p class="hint-line">Si eliminas el proyecto también se borran sus ${st.total} tareas.</p>` : ""}
  </form>`, "project", id);
}
function memberSheet(id) {
  const m = id ? M(id) : null; if (id && !m) return;
  const used = new Set(S.members.map(x => x.color));
  const d = m || {name: "", role: "", email: "", phone: "", color: COLORS.find(c => !used.has(c)) || "lav"};
  openSheet(`<form id="sheetForm" class="sheet-form" novalidate>
    <header class="sheet-h"><h2 id="sheetTitle">${m ? "Persona del equipo" : "Agregar persona"}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Cerrar">${I.x}</button></header>
    <label class="fld"><span>Nombre</span><input id="m-name" value="${esc(d.name)}" autofocus></label>
    <label class="fld"><span>Qué hace</span><input id="m-role" value="${esc(d.role || "")}" placeholder="Editor, grabación, anuncios…"></label>
    <label class="fld"><span>Correo con el que entra a JAY OS</span><input id="m-email" type="email" value="${esc(d.email || "")}" placeholder="nombre@correo.com" autocomplete="off"></label>
    <label class="fld"><span>WhatsApp</span><input id="m-phone" type="tel" value="${esc(d.phone || "")}" placeholder="+593 …" autocomplete="off"></label>
    <p class="hint-line">Para que pueda entrar, su usuario en Supabase tiene que tener este mismo correo.</p>
    <fieldset class="fld"><legend>Color</legend><div class="swatches">${COLORS.map(c => `<label title="${COLOR_NAMES[c]}"><input type="radio" name="m-color" value="${c}" ${d.color === c ? "checked" : ""} aria-label="${COLOR_NAMES[c]}"><span style="--c:var(--${c})"></span></label>`).join("")}</div></fieldset>
    <footer class="sheet-f">${m && m.id !== S.me ? `<button type="button" class="btn-ghost danger" data-act="del-member" data-id="${esc(m.id)}">${I.trash}Quitar</button>` : ""}<div class="sheet-f-r"><button type="button" class="btn-ghost" data-act="close">Cancelar</button><button type="submit" class="btn-pill">${m ? "Guardar" : "Agregar"}</button></div></footer>
  </form>`, "member", id);
}
function accountSheet() {
  const me = S.me && M(S.me);
  openSheet(`<form id="sheetForm" class="sheet-form" novalidate>
    <header class="sheet-h">${me ? av(me, "lg") : ""}<h2 id="sheetTitle">${esc(me ? me.name : "Mi cuenta")}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Cerrar">${I.x}</button></header>
    <p class="muted" style="margin:0">Entraste con ${esc(myEmail())}</p>
    <fieldset class="sub-fs"><legend class="muted">Cambiar mi contraseña</legend>
      <label class="fld"><span>Nueva contraseña</span><input type="password" id="a-pass" autocomplete="new-password"></label>
      <label class="fld"><span>Repite la nueva contraseña</span><input type="password" id="a-pass2" autocomplete="new-password"></label>
    </fieldset>
    <footer class="sheet-f"><button type="button" class="btn-ghost" data-act="logout">Cerrar sesión</button><div class="sheet-f-r"><button type="submit" class="btn-pill">Guardar contraseña</button></div></footer>
  </form>`, "account");
}
async function saveSheet() {
  const sh = $("#sheet"), kind = sh.dataset.kind, id = sh.dataset.id || null;
  if (kind === "account") {
    const a = $("#a-pass").value, b = $("#a-pass2").value;
    if (a.length < 6) { $("#a-pass").classList.add("bad"); toast("La contraseña debe tener al menos 6 caracteres."); return; }
    if (a !== b) { $("#a-pass2").classList.add("bad"); toast("Las dos contraseñas no coinciden."); return; }
    let r; try { r = await S.sb.auth.updateUser({password: a}); } catch (e) { r = {error: e}; }
    if (r.error) { toast("No se pudo cambiar la contraseña. Prueba con otra más larga."); return; }
    closeSheet(); toast("Listo, tu contraseña quedó cambiada.");
    return;
  }
  if (S.readOnly) { closeSheet(); return; }
  const now = new Date().toISOString();
  if (kind === "task") {
    const title = $("#f-title").value.trim();
    if (!title) { $("#f-title").classList.add("bad"); $("#f-title").focus(); return; }
    const status = (sh.querySelector('input[name="f-status"]:checked') || {}).value || "todo";
    let start = $("#f-start").value || null, due = $("#f-due").value || null;
    if (start && due && start > due) [start, due] = [due, start];
    const data = {title, projectId: $("#f-project").value || null, assignee: $("#f-assignee").value || null, status, prio: Number($("#f-prio").value) || 3,
      phase: $("#f-phase").value === "" ? null : Number($("#f-phase").value), start, due, focus: $("#f-focus").checked, blocks: $("#f-blocks").checked, notes: $("#f-notes").value.trim(), updatedAt: now};
    const old = id ? T(id) : null;
    if (status === "done" && !(old && isDone(old))) { data.doneBy = S.me || null; data.doneAt = now; }
    if (status !== "done") { data.doneBy = null; data.doneAt = null; }
    closeSheet();
    if (old) { if (await write("tasks/" + id, "update", data)) toast("Cambios guardados."); }
    else { data.createdAt = now; data.createdBy = S.me || null; if (await write("tasks/" + newId("tasks"), "set", data)) toast("Tarea creada."); }
  } else if (kind === "project") {
    const name = $("#p-name").value.trim();
    if (!name) { $("#p-name").classList.add("bad"); $("#p-name").focus(); return; }
    const data = {name, color: (sh.querySelector('input[name="p-color"]:checked') || {}).value || "lav", estado: $("#p-estado").value, etapa: $("#p-etapa").value, tipo: $("#p-tipo").value, prio: $("#p-prio").value,
      start: $("#p-start").value || null, launch: $("#p-launch").value || null, owner: $("#p-owner").value || null, notes: $("#p-notes").value.trim(), updatedAt: now};
    const pos = parseInt($("#p-rank").value, 10);
    const posNow = id ? [...S.projects].sort(byRank).findIndex(x => x.id === id) + 1 : 0;
    closeSheet();
    if (id) { if (await write("projects/" + id, "update", data)) { if (pos && pos !== posNow) await placeProject(id, pos); toast("Proyecto guardado."); } }
    else { data.createdAt = now; const nid = newId("projects"); if (await write("projects/" + nid, "set", data)) { await placeProject(nid, pos || S.projects.length + 1); toast("Proyecto creado. Ahora agrégale tareas."); } }
  } else if (kind === "member") {
    const name = $("#m-name").value.trim();
    if (!name) { $("#m-name").classList.add("bad"); $("#m-name").focus(); return; }
    const email = $("#m-email").value.trim().toLowerCase();
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $("#m-email").classList.add("bad"); $("#m-email").focus(); toast("Ese correo no parece válido."); return; }
    const data = {name, role: $("#m-role").value.trim(), email: email || null, phone: $("#m-phone").value.trim() || null, color: (sh.querySelector('input[name="m-color"]:checked') || {}).value || "lav", updatedAt: now};
    closeSheet();
    if (id) { if (await write("members/" + id, "update", data)) toast("Guardado."); }
    else { data.createdAt = now; if (await write("members/" + newId("members"), "set", data)) toast(`${name} ya está en el equipo.`); }
  }
}
async function confirmThen(btn, label, fn) {
  if (btn.dataset.armed === "1") { btn.disabled = true; await fn(); return; }
  btn.dataset.armed = "1"; btn.classList.add("confirm"); btn.innerHTML = `${I.trash}${label}`;
  setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ""; btn.classList.remove("confirm"); btn.innerHTML = `${I.trash}${btn.dataset.act === "del-member" ? "Quitar" : "Eliminar"}`; } }, 4000);
}

/* ---------- Avisos ---------- */
let toastTimer = 0;
function toast(msg, undo) {
  const el = $("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button class="toast-undo" data-act="undo">Deshacer</button>` : ""}`;
  S.undo = undo || null; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; S.undo = null; }, undo ? 6500 : 3600);
}

/* ---------- Eventos ---------- */
function setView(v) {
  if (!VIEWS.includes(v)) return;
  S.view = v; store.set("jayos.view", v);
  try { history.replaceState(null, "", "#" + v); } catch (e) {}
  render();
  const st = $("#stage"); if (st && st.scrollTop > 0) st.scrollTop = 0;
}
function closeSide() { $("#side").classList.remove("open"); if ($("#sheet").hidden) $("#scrim").hidden = true; }
async function act(a, el) {
  const id = el.dataset.id;
  switch (a) {
    case "tick": { const t = T(id); if (t) await setStatus(id, isDone(t) ? "todo" : "done"); break; }
    case "new-task": taskSheet(null); break;
    case "add-in-col": taskSheet(null, {status: el.dataset.status}); break;
    case "add-on-day": taskSheet(null, {due: el.dataset.day}); break;
    case "new-project": closeSide(); projectSheet(null); break;
    case "edit-project": closeSide(); projectSheet(id); break;
    case "new-member": closeSide(); memberSheet(null); break;
    case "edit-member": closeSide(); memberSheet(id); break;
    case "account": closeSide(); accountSheet(); break;
    case "logout": if (!$("#sheet").hidden) closeSheet(); try { await S.sb.auth.signOut(); } catch (e) { showLogin(true); } break;
    case "filter-project": S.f.project = id || null; closeSide(); render(); break;
    case "goto-day": S.week = mondayOf(el.dataset.day); closeSide(); setView("semana"); break;
    case "cal-prev": case "cal-next": { const [y, m] = S.cal.split("-").map(Number); const n = (y * 12 + m - 1) + (a === "cal-next" ? 1 : -1); S.cal = `${Math.floor(n / 12)}-${pad(n % 12 + 1)}`; renderSide(); break; }
    case "week-prev": S.week = fromNum(dnum(S.week) - 7); S.cal = S.week.slice(0, 7); render(); break;
    case "week-next": S.week = fromNum(dnum(S.week) + 7); S.cal = S.week.slice(0, 7); render(); break;
    case "week-today": S.week = mondayOf(todayIso()); S.cal = todayIso().slice(0, 7); render(); break;
    case "tl-toggle": if (S.f.project) break; S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); break;
    case "view": setView(el.dataset.view); break;
    case "show-done": S.showAllDone = true; render(); break;
    case "close": closeSheet(); break;
    case "menu": $("#side").classList.add("open"); $("#scrim").hidden = false; break;
    case "side-close": closeSide(); break;
    case "undo": if (S.undo) { const u = S.undo; S.undo = null; $("#toast").hidden = true; await u(); } break;
    case "del-task": confirmThen(el, "Sí, eliminar", async () => { closeSheet(); if (await write("tasks/" + id, "delete")) toast("Tarea eliminada."); }); break;
    case "del-project": confirmThen(el, "Sí, eliminar todo", async () => {
      closeSheet();
      S.tasks = S.tasks.filter(t => t.projectId !== id);
      if (await write("projects/" + id, "delete")) { if (S.f.project === id) S.f.project = null; toast("Proyecto eliminado."); render(); }
    }); break;
    case "del-member": confirmThen(el, "Sí, quitar", async () => {
      closeSheet();
      if (await write("members/" + id, "delete")) { toast("Persona quitada del equipo."); loadAll(); }
    }); break;
  }
}
function wireStatic() {
  $("#searchIc").outerHTML = I.search;
  $('[data-act="menu"]').innerHTML = I.menu;
  $('[data-act="side-close"]').innerHTML = I.x;
  $$('.box-h .icon-btn').forEach(b => b.innerHTML = I.plus);
  $("#seg").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); });
  $("#seg").addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = VIEWS.indexOf(S.view), n = VIEWS[(i + (e.key === "ArrowRight" ? 1 : 3)) % 4];
    setView(n); $(`#seg [data-view="${n}"]`).focus();
  });
  $("#projFilter").addEventListener("change", e => { S.f.project = e.target.value || null; render(); });
  $("#fMine").addEventListener("click", () => {
    if (!S.me && !S.f.mine) { toast("Tu correo no está vinculado a nadie del equipo."); return; }
    S.f.mine = !S.f.mine; render();
  });
  $("#fFocus").addEventListener("click", () => { S.f.focus = !S.f.focus; render(); });
  let qT = 0;
  $("#fQ").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { S.f.q = e.target.value; render(); }, 160); });

  document.addEventListener("click", e => {
    const a = e.target.closest("[data-act]");
    if (a && !a.closest("#seg")) { e.preventDefault(); act(a.dataset.act, a); return; }
    if (e.target.closest("#sheet")) return;
    const tk = e.target.closest("[data-task]"); if (tk) { taskSheet(tk.dataset.task); return; }
    const pc = e.target.closest("[data-proj]"); if (pc) { S.f.project = pc.dataset.proj; setView("tablero"); return; }
  });
  $("#scrim").addEventListener("click", () => { if (!$("#sheet").hidden) closeSheet(); closeSide(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if (!$("#sheet").hidden) closeSheet(); else closeSide(); return; }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-task],[data-proj]")) { e.preventDefault(); e.target.click(); }
  });
  $("#sheet").addEventListener("submit", e => { e.preventDefault(); saveSheet(); });
  $("#sheet").addEventListener("input", e => e.target.classList.remove("bad"));

  // Arrastrar y soltar: columnas del tablero y días de la semana
  document.addEventListener("dragstart", e => {
    const c = e.target.closest && e.target.closest("[data-task]");
    if (!c || S.readOnly) return;
    e.dataTransfer.setData("text/plain", c.dataset.task); e.dataTransfer.effectAllowed = "move";
    c.classList.add("dragging");
  });
  document.addEventListener("dragend", () => $$(".dragging,.drop").forEach(x => x.classList.remove("dragging", "drop")));
  document.addEventListener("dragover", e => {
    const z = e.target.closest && e.target.closest("[data-col],[data-dropday]");
    if (!z || S.readOnly) return;
    e.preventDefault();
    $$(".drop").forEach(x => x !== z && x.classList.remove("drop"));
    z.classList.add("drop");
  });
  document.addEventListener("drop", async e => {
    const z = e.target.closest && e.target.closest("[data-col],[data-dropday]");
    if (!z || S.readOnly) return;
    e.preventDefault(); z.classList.remove("drop");
    const id = e.dataTransfer.getData("text/plain"), t = T(id); if (!t) return;
    if (z.dataset.col && (t.status || "todo") !== z.dataset.col) await setStatus(id, z.dataset.col);
    if (z.dataset.dropday && t.due !== z.dataset.dropday) {
      const prev = t.due ?? null, day = z.dataset.dropday;
      if (await write("tasks/" + id, "update", {due: day, updatedAt: new Date().toISOString()})) toast(`Movida al ${fmtShort(day)}.`, () => write("tasks/" + id, "update", {due: prev}));
    }
  });
  let rz = 0;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === "timeline") render(); }, 200); });
  // Si la página queda abierta de un día para otro, "hoy" se actualiza solo
  let lastDay = todayIso();
  setInterval(() => { if (todayIso() !== lastDay) { lastDay = todayIso(); render(); } }, 60000);
}

boot();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JAY OS</title>
<meta name="description" content="Proyectos, tareas y lanzamientos del equipo JAY en un solo lugar.">
<meta name="theme-color" content="#0f0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23b8aaf8'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='34' fill='%2315131a'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: marco oscuro tipo app (columna de control siempre oscura a la izquierda) + escenario con banda lima→lavanda arriba y las vistas en una píldora */
:root{
  color-scheme:dark;
  --bg:#0a090e; --stage:#16141c; --surface:#1e1b26; --surface-2:#292533; --line:#2f2a3a;
  --fg:#f3f1f8; --fg-2:#aba5ba; --fg-3:#78728a;
  --accent:#a191ff; --danger:#ff7d70; --ok:#7ddba3; --ok-ink:#0b2516; --weekend:rgba(255,255,255,.03);
  --lime-strong:#d5f26a; --shadow:0 18px 40px -24px rgba(0,0,0,.85);
  /* identidad: iguales en ambos temas */
  --frame:#0f0e13; --side-2:#1b1922; --side-3:#26232f; --side-line:#2b2834; --side-fg:#efedf5; --side-fg-2:#938da1; --side-fg-3:#5c5768; --scrim:rgba(8,7,12,.5);
  --ink:#15131a; --ink-2:rgba(21,19,26,.66); --ink-3:rgba(21,19,26,.38);
  --chip:rgba(255,255,255,.55); --glass:rgba(255,255,255,.45); --white:#ffffff;
  --lime:#d5f26a; --lav:#b8aaf8; --cyan:#8edfe8; --peach:#f7bd6a; --rose:#f5a8c9; --sage:#aee0b4; --sand:#f2dc84; --coral:#f6a08e;
  --band-mid:#ebf6bb; --violet:#5b46dc; --red-solid:#e5483b; --on-pastel-red:#9e1a10;
  --f-ui:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#e4e2eb; --stage:#f7f6fb; --surface:#ffffff; --surface-2:#efeef4; --line:#e0dde8;
  --fg:#16141c; --fg-2:#5d586e; --fg-3:#8a8598;
  --accent:#5b46dc; --danger:#d23c2e; --ok:#1f8a52; --ok-ink:#ffffff; --weekend:rgba(22,20,28,.04);
  --lime-strong:#7c9f10; --shadow:0 16px 36px -26px rgba(30,24,60,.5);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e4e2eb; --stage:#f7f6fb; --surface:#ffffff; --surface-2:#efeef4; --line:#e0dde8;
  --fg:#16141c; --fg-2:#5d586e; --fg-3:#8a8598;
  --accent:#5b46dc; --danger:#d23c2e; --ok:#1f8a52; --ok-ink:#ffffff; --weekend:rgba(22,20,28,.04);
  --lime-strong:#7c9f10; --shadow:0 16px 36px -26px rgba(30,24,60,.5);
}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
svg{flex:none}

.app{height:100%;box-sizing:border-box;padding-block:12px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.frame{height:100%;box-sizing:border-box;background:var(--frame);border-radius:26px;padding:10px;display:grid;grid-template-columns:272px minmax(0,1fr);gap:10px;box-shadow:var(--shadow)}

/* ---------- Columna de control ---------- */
.side{color:var(--side-fg);display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:12px;padding:6px 6px 4px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--lav);color:var(--ink);display:grid;place-items:center;font:700 22px var(--f-ui);letter-spacing:-.02em}
.brand-name{font:700 19px var(--f-ui);letter-spacing:.06em}
.brand-sub{font-size:12.5px;color:var(--side-fg-2)}
.icon-btn.side-close{margin-left:auto;display:none}
.box{background:var(--side-2);border-radius:18px;padding:14px 12px}
.box-h{display:flex;align-items:center;justify-content:space-between;font:600 14px var(--f-ui);padding:0 2px 8px}
.box-h .icon-btn{color:var(--side-fg-2)}
.side-list{display:flex;flex-direction:column;gap:2px}
.srow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--side-fg);padding:7px 8px;border-radius:10px;text-align:left;font-size:13.5px;min-width:0}
.srow:hover{background:var(--side-3)}
.srow.on{background:var(--side-3);box-shadow:inset 0 0 0 1px var(--side-line)}
.srow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .pc{font:500 12px var(--f-mono);color:var(--side-fg-2);font-variant-numeric:tabular-nums}
.srow.dim .nm{color:var(--side-fg-2)}
.pdot{width:10px;height:10px;border-radius:4px;background:var(--c,var(--lav));flex:none}
.sitem{display:flex;align-items:center;gap:4px}
.sitem .srow{flex:1}
.sitem .icon-btn{opacity:0;color:var(--side-fg-2)}
.sitem:hover .icon-btn,.sitem .icon-btn:focus-visible{opacity:1}
.mrow .role{display:block;font-size:12px;color:var(--side-fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .you{font:500 11px var(--f-mono);color:var(--ink);background:var(--lime);border-radius:6px;padding:1px 6px}
.side-foot{margin:auto 6px 4px;font-size:12px;color:var(--side-fg-2);line-height:1.4}

.mc-h{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px;font:600 14px var(--f-ui)}
.mc-h div{display:flex;gap:2px}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mc-w{font:500 11px var(--f-ui);color:var(--side-fg-2);padding-bottom:4px}
.mc-d{position:relative;border:0;background:transparent;color:var(--side-fg);height:30px;border-radius:50%;font:500 12.5px var(--f-ui);font-variant-numeric:tabular-nums;padding:0}
.mc-d:hover{background:var(--side-3)}
.mc-d.out{color:var(--side-fg-3)}
.mc-d.inwk{background:var(--side-3);border-radius:8px}
.mc-d.today{background:var(--lime);color:var(--ink);border-radius:50%}
.mc-d i{position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--lav)}
.mc-d.today i{background:var(--ink)}
.mc-d b{position:absolute;right:3px;top:3px;width:6px;height:6px;transform:rotate(45deg);background:var(--peach)}

.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;color:inherit;padding:0}
.icon-btn:hover{background:rgba(127,127,140,.16)}

/* ---------- Escenario ---------- */
.stage{background:var(--stage);border-radius:20px;overflow:auto;min-width:0;min-height:0;display:flex;flex-direction:column;scrollbar-width:thin}
.band{margin:10px 10px 0;border-radius:18px;background:linear-gradient(118deg,var(--lime) 0%,var(--band-mid) 40%,var(--lav) 100%);color:var(--ink);padding:16px 18px 14px;display:flex;flex-direction:column;gap:12px}
.band-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.icon-btn.menu-btn{display:none;background:var(--glass)}
.titles{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.titles h1{font:600 28px/1.1 var(--f-ui);letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.titles .sub{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.wnav{display:inline-flex;align-items:center;gap:4px}
.wnav .icon-btn{color:var(--ink)}
.pill-dark{border:0;background:var(--ink);color:var(--white);border-radius:999px;padding:4px 12px;font:500 13px var(--f-ui)}
.seg{display:inline-flex;background:var(--glass);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 15px;border-radius:999px;font:500 14px var(--f-ui);white-space:nowrap}
.seg button:hover{background:var(--chip)}
.seg button[aria-selected="true"]{background:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.band-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.who{display:flex;align-items:center;gap:6px;background:var(--glass);border-radius:999px;padding:3px 6px 3px 3px}
.who-legacy select{border:0;background:transparent;color:var(--ink);font:500 14px var(--f-ui);padding:5px 2px;max-width:150px;cursor:pointer}
.who{border:0;color:var(--ink);cursor:pointer;font:500 14px var(--f-ui);padding:3px 14px 3px 3px;gap:8px}
.who:hover{background:var(--chip)}
.who-name{max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Inicio de sesión */
.login{min-height:100%;box-sizing:border-box;display:grid;place-items:center;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.login-card{width:min(420px,100%);background:var(--stage);color:var(--fg);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.login-top{background:linear-gradient(118deg,var(--lime) 0%,var(--band-mid) 45%,var(--lav) 100%);color:var(--ink);padding:22px 24px;display:flex;align-items:center;gap:12px}
.login-top .brand-name{font:700 21px var(--f-ui);letter-spacing:.06em}
.login-top .brand-sub{font-size:13px;color:var(--ink-2)}
.login-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px}
.login-body h1{font:600 22px var(--f-ui)}
.login-body .btn-pill{justify-content:center;padding:12px 18px;background:var(--fg);color:var(--stage)}
.login-body .btn-pill:disabled{opacity:.6;cursor:wait}
.login-err{margin:0;color:var(--danger);font-size:14px}
.login-note{margin:0;color:var(--fg-3);font-size:13px}
.sheet .sub-fs{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px}
.btn-pill{border:0;background:var(--ink);color:var(--white);border-radius:999px;padding:9px 18px;font:500 14px var(--f-ui);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-pill:hover{opacity:.9}
.filters{gap:8px}
.fsel select{appearance:none;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 30px 7px 14px;font:500 13.5px var(--f-ui);max-width:260px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.chip-t{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 13.5px var(--f-ui);display:inline-flex;align-items:center;gap:6px}
.chip-t[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.search{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:0 12px;margin-left:auto;min-width:0;flex:0 1 240px}
.search input{border:0;background:transparent;color:var(--ink);padding:7px 0;width:100%;min-width:0;outline:none}
.search input::placeholder{color:var(--ink-2)}
.search:focus-within{box-shadow:0 0 0 2px var(--ink)}

.notice{margin:10px 10px 0;border-radius:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--fg-2);display:flex;gap:8px;align-items:center}
.content{padding:16px 18px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;font:600 18px var(--f-ui)}
.sec-h span{font:400 13px var(--f-ui);color:var(--fg-3)}
.muted{color:var(--fg-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- Avatares ---------- */
.av{width:26px;height:26px;border-radius:50%;background:var(--c,var(--lav));color:var(--ink);display:inline-grid;place-items:center;font:600 10.5px var(--f-ui);letter-spacing:.02em;flex:none}
.av.sm{width:22px;height:22px;font-size:9.5px}
.av.lg{width:34px;height:34px;font-size:12.5px}
.av.none{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.av.none svg{width:13px;height:13px}

/* ---------- Resumen ---------- */
.sum-top{display:grid;grid-template-columns:minmax(260px,1.05fr) minmax(0,2fr);gap:12px}
.hero{background:var(--ink);color:var(--white);border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:18px}
.hero .lbl{font:600 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.hero .big{font:600 44px/1 var(--f-ui);letter-spacing:-.02em;margin:6px 0 4px}
.hero .sm{font-size:13.5px;color:rgba(255,255,255,.7)}
.ring{width:118px;height:118px;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0}
.stat .lbl{font-size:13px;color:var(--fg-2);display:flex;align-items:center;gap:7px}
.stat .lbl i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.stat .num{font:500 32px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat.alert .num{color:var(--danger)}
.stat .hint{font-size:12.5px;color:var(--fg-3)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s ease,border-color .15s}
.pcard:hover{transform:translateY(-2px);border-color:var(--fg-3)}
.pcard-h{background:var(--c);color:var(--ink);padding:14px 14px 12px 16px;display:flex;gap:8px;align-items:flex-start}
.pcard-h .t{flex:1;min-width:0}
.pcard-h .kick{font:500 11.5px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.pcard-h h4{font:600 17px/1.25 var(--f-ui);margin-top:3px}
.pcard-h .icon-btn{color:var(--ink);background:var(--chip)}
.pcard-b{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.prog{display:flex;align-items:center;gap:10px}
.prog .track{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog .track span{display:block;height:100%;border-radius:99px;background:var(--c)}
.prog .n{font:500 12.5px var(--f-mono);color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.phases{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ph{display:flex;flex-direction:column;gap:4px;min-width:0}
.ph .b{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.ph .b span{display:block;height:100%;background:var(--fg-2)}
.ph.none .b{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.ph em{font:500 10.5px var(--f-mono);font-style:normal;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.cur em{color:var(--fg)}
.ph.cur .b span{background:var(--lime-strong)}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--fg-2)}
.pmeta b{color:var(--fg);font-weight:500}
.pmeta .od{color:var(--danger)}
.pnext{border-top:1px dashed var(--line);padding-top:10px;color:var(--fg-2);display:flex;gap:6px;min-width:0}
.pnext b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.estado{font:500 11.5px var(--f-ui);border-radius:99px;padding:2px 9px;background:var(--chip);color:var(--ink)}

.sum-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile h3{font:600 16px var(--f-ui);display:flex;align-items:baseline;gap:8px}
.tile h3 span{font:400 13px var(--f-ui);color:var(--fg-3)}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;cursor:pointer;min-width:0}
.lrow:hover{background:var(--surface-2)}
.lrow .tt{flex:1;min-width:0}
.lrow .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .tt span{display:block;font-size:12.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dchip{font:500 12px var(--f-mono);border-radius:8px;padding:3px 8px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.dchip.od{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.team-row{display:flex;align-items:center;gap:10px;padding:6px 4px}
.team-row .tt{flex:1;min-width:0}
.team-row b{font-weight:500}
.team-row span{display:block;font-size:12.5px;color:var(--fg-3)}
.team-row .n{text-align:right;font:500 12.5px var(--f-mono);color:var(--fg-2);white-space:nowrap}

/* ---------- Tablero ---------- */
.board-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px;scrollbar-width:thin}
.board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:12px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:220px;transition:box-shadow .15s}
.col.drop{box-shadow:0 0 0 2px var(--accent)}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 2px;font:600 12.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.col-h .n{font:500 12px var(--f-mono);background:var(--surface-2);border-radius:7px;padding:1px 7px;letter-spacing:0;color:var(--fg)}
.col-h .icon-btn{margin-left:auto;color:var(--fg-2)}
.col-empty{font-size:13px;color:var(--fg-3);text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:14px}
.more{border:0;background:transparent;color:var(--fg-2);font:500 13px var(--f-ui);padding:6px;border-radius:10px}
.more:hover{background:var(--surface-2)}

.card{--t:var(--ink);--t2:var(--ink-2);--t3:var(--ink-3);--ch:var(--chip);background:var(--c);color:var(--t);border-radius:16px;padding:11px 12px 10px;display:flex;flex-direction:column;gap:7px;cursor:pointer;transition:transform .12s ease}
.card:hover{transform:translateY(-1px)}
.card.dragging{opacity:.45}
.card.is-done{--t:var(--fg-2);--t2:var(--fg-3);--t3:var(--fg-3);--ch:var(--surface);background:var(--surface-2)}
.card-top{display:flex;align-items:center;gap:6px}
.due{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--f-ui);color:var(--t2)}
.due svg{width:13px;height:13px}
.due.od{background:var(--ch);color:var(--on-pastel-red);border-radius:7px;padding:2px 7px}
.is-done .due.od{color:var(--t2);background:transparent;padding:0}
.tick{margin-left:auto;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--t3);background:transparent;color:var(--t2);display:grid;place-items:center;padding:0;flex:none}
.tick svg{width:14px;height:14px;opacity:0;transition:opacity .12s}
.tick:hover svg{opacity:.6}
.tick:disabled{cursor:default}
.is-done .tick{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.is-done .tick svg{opacity:1}
.card-title{font:500 14.5px/1.3 var(--f-ui);overflow-wrap:anywhere}
.is-done .card-title{text-decoration:line-through;text-decoration-thickness:1px}
.card-meta{font-size:12.5px;color:var(--t2);display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.card-meta .pj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-foot .av{margin-left:auto}
.tag{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--f-ui);border-radius:7px;padding:2px 7px;background:var(--ch);color:var(--t)}
.tag svg{width:12px;height:12px}
.tag.p1{background:var(--ink);color:var(--white)}
.is-done .tag.p1{background:var(--ch);color:var(--t)}
.done-meta{font-size:12px;color:var(--t2)}

/* ---------- Línea de tiempo ---------- */
.tl-notes{display:flex;flex-direction:column;gap:8px}
.tl-note{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.tl-note.warn{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.tl-note.warn svg{color:var(--danger)}
.tl-note svg{margin-top:2px}
.tl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tl-scroll{overflow-x:auto;scrollbar-width:thin}
.tl{position:relative;width:calc(var(--lw) + var(--tw))}
.tl-head,.tl-row{display:flex;width:calc(var(--lw) + var(--tw))}
.tl-head{height:56px;position:relative;z-index:4}
.tl-row{height:48px;border-top:1px solid var(--line);position:relative}
.tl-row.sub{height:36px}
.tl-lab{position:sticky;left:0;z-index:3;flex:0 0 var(--lw);width:var(--lw);box-sizing:border-box;background:var(--surface);border:0;border-right:1px solid var(--line);padding:0 10px 0 8px;display:flex;align-items:center;gap:8px;min-width:0;text-align:left;color:var(--fg);font:500 14px var(--f-ui)}
button.tl-lab:hover{background:var(--surface-2)}
.tl-lab .chev{color:var(--fg-3);display:grid}
.tl-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-n{font:500 11.5px var(--f-mono);color:var(--fg-3)}
.sub-lab{padding-left:34px;font-size:13px;color:var(--fg-2);cursor:pointer}
.sub-lab svg{width:13px;height:13px;color:var(--ok)}
.tl-track{position:relative;flex:0 0 var(--tw);width:var(--tw);overflow:hidden}
.tl-grid{position:absolute;top:56px;bottom:0;left:var(--lw);width:var(--tw);pointer-events:none;z-index:0}
.wk{position:absolute;top:0;bottom:0;background:var(--weekend)}
.nowline{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);opacity:.85}
.tl-m{position:absolute;top:8px;font:600 12.5px var(--f-ui);text-transform:capitalize;white-space:nowrap;padding-left:6px;border-left:1px solid var(--line)}
.tl-d{position:absolute;bottom:6px;height:24px;display:grid;place-items:center;font:500 11px var(--f-mono);color:var(--fg-3)}
.tl-d.we{color:var(--fg-3);opacity:.6}
.tl-d.now{color:var(--ink);background:var(--lime);border-radius:8px;opacity:1}
.tl-corner{display:flex;align-items:flex-end;padding-bottom:10px;font:600 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.bar{position:absolute;top:10px;height:28px;border-radius:10px;background:var(--c);color:var(--ink);font:500 12px var(--f-ui);display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden;z-index:1;box-sizing:border-box}
.bar.open{-webkit-mask-image:linear-gradient(to right,#000 55%,transparent);mask-image:linear-gradient(to right,#000 55%,transparent)}
.dot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--c);z-index:2}
.dot.done{background:var(--c);box-shadow:0 0 0 1.5px var(--ink-3)}
.dot.over{background:var(--red-solid)}
.launch{position:absolute;top:4px;z-index:3;display:flex;align-items:center;gap:4px;transform:translateX(-7px);pointer-events:none}
.launch i{width:13px;height:13px;transform:rotate(45deg);background:var(--fg);border:2px solid var(--surface);border-radius:2px}
.launch em{font:600 11px var(--f-ui);font-style:normal;color:var(--fg);background:var(--surface);border-radius:6px;padding:1px 5px;white-space:nowrap}
.tbar{position:absolute;top:9px;height:18px;border-radius:7px;background:var(--c);z-index:1;min-width:10px}
.tbar.done{opacity:.4}
.tbar.over{box-shadow:inset 0 0 0 2px var(--red-solid)}
.tl-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-3);padding:10px 14px;border-top:1px solid var(--line)}
.tl-legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:9px;height:9px;border-radius:50%;background:var(--fg-2)}
.lg-dia{width:9px;height:9px;transform:rotate(45deg);background:var(--fg)}
.lg-now{width:2px;height:12px;background:var(--accent)}
.lg-red{width:9px;height:9px;border-radius:50%;background:var(--red-solid)}

/* ---------- Semana ---------- */
.week-bar{display:flex;gap:8px;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{display:flex;flex-direction:column;gap:8px;min-width:0}
.wpill{border-radius:14px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:baseline;gap:6px}
.wpill span{font-size:13.5px;color:var(--fg-2)}
.wpill b{font:600 24px/1 var(--f-ui)}
.wpill em{margin-left:auto;font:500 11.5px var(--f-mono);font-style:normal;color:var(--fg-3)}
.wday.is-today .wpill{background:var(--white);border-color:var(--white);color:var(--ink);box-shadow:0 0 0 2px var(--violet)}
.wday.is-today .wpill span{color:var(--ink-2)}
.wday.is-today .wpill b{color:var(--violet)}
.wday.is-today .wpill em{color:var(--ink-2)}
.wday.past .wpill b{color:var(--fg-3)}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:360px;padding:7px;display:flex;flex-direction:column;gap:7px;background-image:repeating-linear-gradient(to bottom,transparent 0 59px,var(--line) 59px 60px)}
.wcol.drop{box-shadow:0 0 0 2px var(--accent)}
.wblock{--t:var(--ink);--t2:var(--ink-2);--t3:var(--ink-3);--ch:var(--chip);background:var(--c);color:var(--t);border-radius:12px;padding:8px 9px;font-size:13px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.wblock.is-done{--t:var(--fg-2);--t2:var(--fg-3);--t3:var(--fg-3);background:var(--surface-2)}
.wblock .card-title{font-size:13px}
.wblock .row{display:flex;align-items:center;gap:6px}
.wblock .row span{flex:1;min-width:0;font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wblock .tick{width:20px;height:20px}
.wblock .tick svg{width:12px;height:12px}
.wlaunch{display:flex;align-items:center;gap:6px;background:var(--fg);color:var(--stage);border-radius:10px;padding:6px 8px;font:600 12px var(--f-ui)}
.wlaunch svg{width:13px;height:13px;color:var(--c)}
.wadd{margin-top:auto;border:1px dashed var(--line);background:transparent;color:var(--fg-3);border-radius:10px;height:30px;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.wday:hover .wadd,.wadd:focus-visible{opacity:1}

/* ---------- Estados vacíos ---------- */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px 26px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;max-width:620px}
.empty h2{font:600 22px var(--f-ui)}
.empty p{margin:0;color:var(--fg-2);max-width:52ch}
.skel{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- Hoja lateral (formularios) ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;backdrop-filter:blur(2px)}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);box-sizing:border-box;background:var(--stage);color:var(--fg);z-index:41;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 22px;border-left:1px solid var(--line);box-shadow:-30px 0 60px -30px rgba(0,0,0,.5)}
.sheet-form{display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{font:600 21px var(--f-ui);flex:1}
.sheet-h .pdot{width:14px;height:14px;border-radius:5px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span,.fld>legend{font:500 12.5px var(--f-ui);color:var(--fg-2);letter-spacing:.02em}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);width:100%;box-sizing:border-box;min-width:0}
.fld textarea{resize:vertical;line-height:1.45}
.fld #f-title{font:500 17px/1.35 var(--f-ui)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.fld .bad{outline:2px solid var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset.fld{border:0;padding:0;margin:0}
.seg2{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg2 label{flex:1;position:relative}
.seg2 input{position:absolute;opacity:0;pointer-events:none}
.seg2 span{display:block;text-align:center;padding:8px 6px;border-radius:9px;font:500 13.5px var(--f-ui);color:var(--fg-2);cursor:pointer}
.seg2 input:checked+span{background:var(--fg);color:var(--stage)}
.seg2 input:focus-visible+span{outline:2px solid var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:30px;height:30px;border-radius:10px;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--stage),0 0 0 4px var(--fg)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:4px}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--accent)}
.done-by{margin:0;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:10px;padding:8px 12px}
.sheet-f{display:flex;align-items:center;gap:8px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.sheet-f-r{margin-left:auto;display:flex;gap:8px}
.sheet .btn-pill{background:var(--fg);color:var(--stage)}
.btn-ghost{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:8px 16px;font:500 14px var(--f-ui);display:inline-flex;align-items:center;gap:6px}
.btn-ghost:hover{background:var(--surface)}
.btn-ghost.danger{color:var(--danger)}
.btn-ghost.danger.confirm{background:var(--danger);border-color:var(--danger);color:var(--white)}
.hint-line{font-size:12.5px;color:var(--fg-3);margin:-6px 0 0}

/* ---------- Aviso flotante ---------- */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--white);border-radius:999px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 14px 30px -12px rgba(0,0,0,.6);max-width:calc(100% - 32px);box-sizing:border-box}
.toast:not(:has(button)){padding-right:18px}
.toast-undo{border:0;background:var(--lime);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--f-ui)}

.ro [data-edit]{display:none!important}
body.locked{overflow:hidden}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .sum-top{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:980px){
  html,body{height:auto}
  .app{height:auto}
  .frame{height:auto;grid-template-columns:minmax(0,1fr);padding:8px;border-radius:22px}
  .stage{overflow:visible}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);z-index:45;background:var(--frame);padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .22s ease;box-shadow:20px 0 50px -20px rgba(0,0,0,.6)}
  .side.open{transform:none}
  .icon-btn.side-close{display:inline-grid}
  .icon-btn.menu-btn{display:inline-grid}
  .sum-cols{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wcol{min-height:140px}
}
@media (max-width:680px){
  .band{padding:14px 14px 12px}
  .titles h1{font-size:23px}
  .seg{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
  .seg button{flex:1;padding:7px 8px;font-size:13.5px}
  .band-actions{margin-left:0}
  .search{flex:1 1 100%;margin-left:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:16px}
  .ring{width:96px;height:96px}
  .hero .big{font-size:36px}
  .content{padding:14px 12px 24px}
  .board{grid-template-columns:repeat(3,82vw);scroll-snap-type:x mandatory}
  .board-wrap{scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .week{grid-template-columns:minmax(0,1fr)}
  .wadd{opacity:1}
  .grid2{grid-template-columns:1fr}
  .sheet{top:auto;left:0;width:100%;max-height:92dvh;border-radius:22px 22px 0 0;border-left:0;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}

<body>

<div class="app" id="app">
  <div class="frame">
    <aside class="side" id="side" aria-label="Proyectos y equipo">
      <div class="brand">
        <div class="logo" aria-hidden="true">J</div>
        <div>
          <div class="brand-name">JAY OS</div>
          <div class="brand-sub">Centro de proyectos</div>

      </section>

    <main class="stage" id="stage">

        <div class="band-row">
          <button class="icon-btn menu-btn" data-act="menu" aria-label="Abrir proyectos y equipo"></button>
          <div class="titles" id="titles"><h1>JAY OS</h1><div class="sub">Cargando…</div></div>
          <nav class="seg" id="seg" role="tablist" aria-label="Vistas">
            <button role="tab" data-view="resumen" aria-selected="false">Resumen</button>
            <button role="tab" data-view="tablero" aria-selected="false">Tablero</button>
            <button role="tab" data-view="timeline" aria-selected="false">Timeline</button>
            <button role="tab" data-view="semana" aria-selected="false">Semana</button>
          </nav>
          <div class="band-actions">

          </div>
        </div>
        <div class="band-row filters">
          <label class="fsel"><select id="projFilter" aria-label="Filtrar por proyecto"><option value="">Todos los proyectos</option></select></label>
          <button class="chip-t" id="fMine" aria-pressed="false">Mis tareas</button>
          <button class="chip-t" id="fFocus" aria-pressed="false">Foco de la semana</button>
          <label class="search"><span id="searchIc"></span><input id="fQ" type="search" placeholder="Buscar tarea" aria-label="Buscar tarea" autocomplete="off"></label>
        </div>
      </header>
      <div class="notice" id="notice" hidden></div>
      <div class="content" id="content"><div class="skel"></div><div class="skel"></div></div>
    </main>
  </div>
</div>
<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-top"><div class="logo" aria-hidden="true">J</div><div><div class="brand-name">JAY OS</div><div class="brand-sub">Centro de proyectos</div></div></div>
    <div class="login-body">
      <h1>Entra a tu tablero</h1>
      <label class="fld"><span>Correo</span><input id="l-email" type="email" autocomplete="email" inputmode="email" required></label>
      <label class="fld"><span>Contraseña</span><input id="l-pass" type="password" autocomplete="current-password" required></label>
      <p class="login-err" id="loginErr" role="alert" hidden></p>
      <button class="btn-pill" type="submit" id="loginBtn">Entrar</button>
      <p class="login-note">¿Todavía no tienes acceso? Pídele a Jay que te cree el usuario.</p>
    </div>
  </form>
</section>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(() => {

const PHASE_SHORT = ["Def","Inv","Prod","Emb","Lanz","Opt"];
const PRIO = {1:"Urgente",2:"Alta",3:"Normal",4:"Baja"};
const STAT = [["todo","Por hacer"],["doing","En proceso"],["done","Hecho"]];
const COLORS = ["lime","lav","cyan","peach","rose","sage","sand","coral"];
const COLOR_NAMES = {lime:"Lima",lav:"Lavanda",cyan:"Celeste",peach:"Durazno",rose:"Rosa",sage:"Salvia",sand:"Arena",coral:"Coral"};
const P_ESTADO = ["Activo","Por arrancar","En pausa","Terminado"];
const P_ETAPA = ["Montaje","Pre-lanzamiento","En vivo","Escalando"];
const P_TIPO = ["Producto propio","Servicio","Cliente","Marca personal"];
const P_PRIO = ["Alta","Media","Baja"];
const VIEWS = ["resumen","tablero","timeline","semana"];
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIA = ["dom","lun","mar","mié","jue","vie","sáb"];
const DIAL = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Fechas (siempre como "AAAA-MM-DD", contadas en días) ---------- */
const pad = n => String(n).padStart(2, "0");
const localIso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => localIso(new Date());

const dnum = s => { const [y,m,d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m-1, d) / 864e5); };
const fromNum = n => { const d = new Date(n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };

const toSnake = k => k.replace(/[A-Z]/g, c => "_" + c.toLowerCase());
const toCamel = k => k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const fromRow = r => { const o = {}; for (const k in r) o[toCamel(k)] = r[k]; return o; };
const toRow = (table, d) => {
  const o = {};
  for (const k in d) { const c = toSnake(k); if (COLS[table].includes(c)) o[c] = d[k] === "" && ["start", "due", "launch", "email", "phone"].includes(c) ? null : d[k]; }
  return o;
};
const chains = {};
function enqueue(path, fn) {
  const next = (chains[path] || Promise.resolve()).catch(() => {}).then(fn);
  chains[path] = next;
  return next;
}
function putLocal(table, row) {
  const arr = S[table], i = arr.findIndex(x => x.id === row.id);
  if (i >= 0) arr[i] = Object.assign({}, arr[i], row); else arr.push(row);
}
function dropLocal(table, id) { const arr = S[table], i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1); }
async function write(path, op, data) {
  if (!S.sb || !S.session) { toast("Inicia sesión para guardar cambios."); return false; }
  const [table, id] = path.split("/");
  if (!COLS[table] || !id) return false;
  if (op === "delete") dropLocal(table, id); else putLocal(table, Object.assign({}, data, {id}));
  schedule();
  let res;
  try {
    res = await enqueue(path, () =>
      op === "delete" ? S.sb.from(table).delete().eq("id", id).select("id")
      : op === "update" ? S.sb.from(table).update(toRow(table, data)).eq("id", id).select()
      : S.sb.from(table).insert(toRow(table, Object.assign({}, data, {id}))).select());
  } catch (e) { res = {error: e}; }
  const failed = !!res.error || !res.data || (op !== "delete" && !res.data.length);
  if (failed) {
    const code = res.error && String(res.error.code || "");
    if (code === "42501" || (!res.error && res.data && !res.data.length)) toast("No tienes permiso para cambiar esto. Revisa que tu correo esté en el equipo.");
    else if (code === "23505") toast("Ese dato ya existe. Por ejemplo, ese correo ya está en el equipo.");
    else if (res.error && /fetch|network|Failed/i.test(res.error.message || "")) toast("Sin conexión. Revisa tu internet y vuelve a intentarlo.");
    else toast("No se pudo guardar el cambio. Vuelve a intentarlo.");
    loadAll();
    return false;
  }
  if (op !== "delete" && res.data[0]) { putLocal(table, fromRow(res.data[0])); schedule(); }
  return true;
}

function listen() {
  if (S.channel) { S.sb.removeChannel(S.channel); S.channel = null; }
  S.channel = S.sb.channel("jayos-cambios")
    .on("postgres_changes", {event: "*", schema: "public"}, p => {
      if (!TABLES.includes(p.table)) return;
      if (p.eventType === "DELETE") { if (p.old && p.old.id) dropLocal(p.table, p.old.id); }
      else if (p.new) putLocal(p.table, fromRow(p.new));
      if (p.table === "members") resolveMe();
      schedule();
    })
    .subscribe(status => {
      if (status === "SUBSCRIBED") { if (S.wasLive === false) loadAll(); S.wasLive = true; }
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") S.wasLive = false;
